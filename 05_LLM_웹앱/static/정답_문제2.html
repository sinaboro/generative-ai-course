<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>세 줄 요약기</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 160px; padding: 8px; font-size: 15px; }
    button { margin-top: 8px; padding: 8px 16px; font-size: 16px; }
    #summary { margin-top: 16px; padding: 16px; background: #f3f0ff; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>📝 세 줄 요약기</h1>
  <textarea id="text" placeholder="요약할 글을 붙여 넣으세요"></textarea>
  <button onclick="summarize()">요약하기</button>
  <div id="summary"></div>

  <script>
    async function summarize() {
      const text = document.getElementById("text").value;
      const box = document.getElementById("summary");
      box.textContent = "요약하는 중...";
      const response = await fetch("/summary", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      });
      const data = await response.json();
      box.textContent = data.summary;
    }
  </script>
</body>
</html>
