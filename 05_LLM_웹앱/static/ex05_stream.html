<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스트리밍 챗봇</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    #message { width: 75%; padding: 8px; font-size: 16px; }
    button { padding: 8px 16px; font-size: 16px; }
    #answer { margin-top: 20px; padding: 16px; background: #f3f0ff; border-radius: 8px; min-height: 40px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>⚡ 스트리밍 챗봇</h1>
  <input id="message" placeholder="질문을 입력하세요">
  <button onclick="send()">보내기</button>
  <div id="answer"></div>

  <script>
    async function send() {
      const message = document.getElementById("message").value;
      const answerBox = document.getElementById("answer");
      answerBox.textContent = "";                       // 이전 답 지우기

      const response = await fetch("/chat-stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
      });

      // 답을 한 번에 받지 않고, 조각이 올 때마다 읽어서 화면에 이어 붙여요
      const reader = response.body.getReader();         // 조각을 읽는 도구
      const decoder = new TextDecoder();                // 받은 데이터를 글자로 바꾸는 도구
      while (true) {
        const result = await reader.read();             // 다음 조각 기다리기
        if (result.done) {                              // 더 올 조각이 없으면 끝
          break;
        }
        answerBox.textContent += decoder.decode(result.value);   // 글자로 바꿔 이어 붙이기
      }
    }
  </script>
</body>
</html>
