<!DOCTYPE html>
<!-- index.html : 새싹전자 사내 도우미 화면 (step3_app.py 서버가 보내 줘요)
     흐름: 이름 칸 + 질문 입력 → [보내기] 또는 Enter → 내 말풍선 그리기
           → /chat 으로 {user_id: 이름, message: 질문} 보내기 → 답 말풍선 + 쓴 도구 🔧 표 그리기 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>새싹전자 사내 도우미</title>
  <style>
    body { font-family: sans-serif; max-width: 680px; margin: 30px auto; padding: 0 16px; background: #fafafa; }
    header { display: flex; align-items: center; justify-content: space-between; }
    #user { padding: 6px; width: 120px; }
    #chat { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 12px; height: 560px; overflow-y: auto; }
    .human { text-align: right; margin: 10px 0; }
    .ai { text-align: left; margin: 10px 0; }
    .bubble { display: inline-block; padding: 9px 13px; border-radius: 14px; max-width: 80%; white-space: pre-wrap; text-align: left; }
    .human .bubble { background: #7c5cff; color: white; }
    .ai .bubble { background: #f1f0f7; }
    .tool { display: inline-block; margin: 4px 4px 0 0; padding: 2px 8px; border-radius: 10px; background: #e3f6e8; color: #20703a; font-size: 12px; }
    #message { width: 78%; padding: 9px; font-size: 16px; margin-top: 12px; }
    button { padding: 9px 16px; font-size: 16px; }
  </style>
</head>
<body>
  <header>
    <h2>🌱 새싹전자 사내 도우미</h2>
    <label>이름 <input id="user" value="김민지"></label>   <!-- 이름 = 대화방 (사람마다 기억이 따로) -->
  </header>
  <div id="chat"></div>
  <!-- onkeydown: 키를 누를 때마다 확인해서 Enter 면 send() 실행 -->
  <input id="message" placeholder="규정 · 계산 · 회의실 예약을 물어보세요" onkeydown="if (event.key === 'Enter') send()">
  <button onclick="send()">보내기</button>

  <script>
    // 말풍선 하나 더하기 (tools 는 AI 가 쓴 도구 이름 목록)
    function addBubble(role, text, tools) {
      const line = document.createElement("div");   // 한 줄
      line.className = role;                        // human 은 오른쪽, ai 는 왼쪽
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      if (tools) {                           // 도구 목록이 있을 때만 (내 말풍선은 없어요)
        for (const name of tools) {          // 쓴 도구를 작은 표로 보여 줘요
          const tag = document.createElement("span");
          tag.className = "tool";
          tag.textContent = "🔧 " + name;
          bubble.appendChild(document.createElement("br"));   // 줄 바꿈
          bubble.appendChild(tag);
        }
      }
      line.appendChild(bubble);
      const chat = document.getElementById("chat");
      chat.appendChild(line);
      chat.scrollTop = chat.scrollHeight;    // 맨 아래로 스크롤
    }

    async function send() {
      const input = document.getElementById("message");
      const message = input.value;
      if (message === "") {                  // 빈칸이면 보내지 않아요
        return;
      }
      input.value = "";
      addBubble("human", message);           // 내 말풍선
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: document.getElementById("user").value, message: message })   // 이름 + 질문
      });
      const data = await response.json();    // {"answer": "...", "tools": [...]}
      addBubble("ai", data.answer, data.tools);
    }
  </script>
</body>
</html>
